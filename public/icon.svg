<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071322" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CC0000" />
      <stop offset="60%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield / Rounded Tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />
  
  <!-- Subtle SANS Standard Target Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#475569" stroke-width="2" opacity="0.4"/>
  
  <!-- Fire Flame Symbol -->
  <path d="M256 90 C260 160 330 200 330 290 C330 360 290 410 256 410 C222 410 182 360 182 290 C182 220 220 180 230 140 C235 120 245 105 256 90 Z" fill="url(#flameGrad)" />
  
  <!-- Inner Golden Spark Core -->
  <path d="M256 210 C262 250 292 280 292 320 C292 355 276 380 256 380 C236 380 220 355 220 320 C220 280 240 250 256 210 Z" fill="url(#goldGrad)" />
  
  <!-- Crosshair Engineering Lines -->
  <line x1="256" y1="56" x2="256" y2="96" stroke="#FFB703" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="456" stroke="#FFB703" stroke-width="6" stroke-linecap="round" />
  <line x1="56" y1="256" x2="96" y2="256" stroke="#FFB703" stroke-width="6" stroke-linecap="round" />
  <line x1="416" y1="256" x2="456" y2="256" stroke="#FFB703" stroke-width="6" stroke-linecap="round" />
  
  <!-- Badge text SANS 10139 -->
  <rect x="146" y="420" width="220" height="40" rx="20" fill="#0D213F" stroke="#FFB703" stroke-width="2" />
  <text x="256" y="445" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SANS 10139</text>
</svg>
